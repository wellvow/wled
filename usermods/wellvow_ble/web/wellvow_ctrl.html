  customPalette:(slot,colors)=>{const rgb=colors.slice(0,8).map(hexRGB).filter(Boolean);return dp(tlv.bytes(0x27,[slot&3,rgb.length,...rgb.flatMap(v=>v)]));},
  applyDiyLook:({on=true,color=null,colors=null,fx=null,palette=null}={})=>{const a=[];if(on!==null)a.push(tlv.bool(0x01,on));if(fx!==null)a.push(tlv.u16(0x05,fx&255));if(palette!==null)a.push(tlv.u8(0x13,palette));const cs=(colors&&colors.length)?colors:(color?[color]:null);if(cs)a.push(tlv.bytes(0x06,colorSlots(cs)));return dp(...a);},
  calibrateColor:(order,hex)=>dp(tlv.bytes(0x1F,[order,...hexRGB(hex)])),

/* ---------------- 设备信息 / 布线 ---------------- */
let INFO={name:'WELLVOW STRIP',model:'WLED_STRIP_ESP32',leds:120,segments:[120]};
let WIRING=null;   // {count, points:[{x,y}], hasWiring}
async function loadInfo(){try{INFO=Object.assign(INFO,await get('/wellvow/info'));}catch(e){}}
async function loadWiring(){
  try{const j=await get('/wellvow/ledmap');const coords=Array.isArray(j.coords)?j.coords:null;if(coords&&coords.length){WIRING={points:coords.map(c=>({x:c[0],y:c[1]})),count:coords.length,hasWiring:true};return;}}catch(e){}
  WIRING=null;
}
function segTotal(a){return a.reduce((s,n)=>s+n,0);}
function currentSegCfg(){   // App useStripWiring:优先 strip_segcfg(段配置页保存的),否则设备实际分段
  const cfg=W.segcfg; if(cfg&&Array.isArray(cfg.segments)&&cfg.segments.length)return {count:segTotal(cfg.segments),segments:cfg.segments.slice()};
  const segs=(INFO.segments&&INFO.segments.length)?INFO.segments.slice():[INFO.leds||120];
  return {count:segTotal(segs),segments:segs};
}
function straightPoints(n){n=Math.max(1,n);return Array.from({length:n},(_,i)=>({x:8+(i/Math.max(1,n-1))*604,y:30}));}
function resample(points,count){if(!points||!points.length)return straightPoints(count);if(count===1){const p=points[Math.floor(points.length/2)];return [{x:p.x,y:p.y}];}
  return Array.from({length:count},(_,i)=>{const p=points[Math.round(i*(points.length-1)/Math.max(1,count-1))];return {x:p.x,y:p.y};});}
function layoutPoints(count,segments){   // 预览点 + 所属段(最多 600 个采样点)
  const total=Math.max(1,count); const n=Math.min(total,600);
  const raw=WIRING&&WIRING.hasWiring?resample(WIRING.points,n):straightPoints(n);
  const ends=[];let acc=0;(segments||[total]).forEach(v=>{acc+=v;ends.push(acc);});
  return raw.map((p,i)=>{const li=Math.min(total-1,Math.floor((i+0.5)*total/raw.length));let s=ends.findIndex(e=>li<e);if(s<0)s=ends.length-1;return {x:p.x,y:p.y,seg:s,li};});
}

/* ---------------- 预览画布(对应 App SignPreview layout="strip") ---------------- */
function Preview(opts){
  const cv=h('canvas',{class:'pv'}); const box=h('div',{class:'hero'},cv);
  let pts=opts.points, effect=opts.effect, sel=opts.selected==null?-1:opts.selected, raf=0, dead=false, W0=0, H0=opts.height||(WIRING&&WIRING.hasWiring?110:70), t0=performance.now();
  const ctx=cv.getContext('2d'); const dpr=Math.min(2,window.devicePixelRatio||1);
  function fit(){W0=box.clientWidth-16;cv.width=W0*dpr;cv.height=H0*dpr;cv.style.height=H0+'px';}
  function draw(){if(dead)return;raf=requestAnimationFrame(draw);if(!W0)fit();if(!W0)return;
    const t=(performance.now()-t0)/1000; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W0,H0);
    let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;for(const p of pts){minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y);}
    const sw=Math.max(1,maxx-minx),sh=Math.max(1,maxy-miny); const sc=Math.min((W0-16)/sw,(H0-16)/sh); const ox=(W0-sw*sc)/2-minx*sc, oy=(H0-sh*sc)/2-miny*sc;
    const r=Math.max(1.6,Math.min(5,(W0/pts.length)*0.42));
    for(let i=0;i<pts.length;i++){const p=pts[i];ctx.fillStyle=effect(p.li,p.seg,t)||DIM;ctx.beginPath();ctx.arc(p.x*sc+ox,p.y*sc+oy,r,0,6.283);ctx.fill();
      if(sel>=0&&p.seg===sel){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;ctx.stroke();}}
  }
  if(opts.onPartPress)cv.addEventListener('click',(e)=>{const rc=cv.getBoundingClientRect();const x=(e.clientX-rc.left),y=(e.clientY-rc.top);
    let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;for(const p of pts){minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y);}
    const sw=Math.max(1,maxx-minx),sh=Math.max(1,maxy-miny);const sc=Math.min((W0-16)/sw,(H0-16)/sh);const ox=(W0-sw*sc)/2-minx*sc,oy=(H0-sh*sc)/2-miny*sc;
    let best=-1,bd=1e9;for(const p of pts){const d=Math.hypot(p.x*sc+ox-x,p.y*sc+oy-y);if(d<bd){bd=d;best=p.seg;}}if(best>=0&&bd<30)opts.onPartPress(best);});
  requestAnimationFrame(()=>{fit();draw();});
  return {el:box,set(o){if(o.effect)effect=o.effect;if(o.points)pts=o.points;if(o.selected!=null)sel=o.selected;},stop(){dead=true;cancelAnimationFrame(raf);}};
}

  try{const j=JSON.parse(await f.text());if(!Array.isArray(j.coords)||!j.coords.length)throw Error(T('不是 Studio 导出的 .wmap(缺 coords)','Not a Studio .wmap export (no coords)'));
    await loadInfo();
    if(j.coords.length>512)throw Error(T('布线图是 ','The wiring map has ')+j.coords.length+T(' 个点,超过控制器上限 512。请在 Studio 里把总点数改成不超过 512',' points, over the controller limit of 512. Lower the total pixels in Studio to 512 or less'));
    await uploadFile('wellvow.wmap',new Blob([JSON.stringify(j)],{type:'application/json'}));await loadWiring();
    // Studio 里画的分段同步成设备的段配置(段数/每段点数),让网页、App、灯带三边一致
    const segs=(Array.isArray(j.seg)&&j.seg.length?j.seg.map(n=>Math.max(1,n|0)):[j.coords.length]).slice(0,32);   // 灯数/分段跟随布线图
    if(segs){const total=segs.reduce((a,b)=>a+b,0);W.segcfg={count:total,segments:segs,ts:Date.now()};saveW();
      await send(async()=>{await Dps.pixelCount(total);await Dps.segConfig(segs);});await loadInfo();}
    await sleep(1500);await loadInfo();
    toast(T('布线图已导入:','Wiring imported: ')+j.coords.length+T(' 点 · ',' px · ')+segs.length+T(' 段,控制器灯数已设为 ',' segments. Controller pixel count set to ')+INFO.leds);route();}
  catch(e){toast(T('导入布线失败:','Wiring import failed: ')+e.message);}}
async function importWseq(onDone){const f=await pickFile('.wseq');if(!f)return;
  try{const buf=new Uint8Array(await f.arrayBuffer());
    if(buf.length<12||buf[0]!==87||buf[1]!==76||buf[2]!==86||buf[3]!==81)throw Error(T('不是 Studio 导出的 .wseq','Not a Studio .wseq export'));
    if(buf.length>48*1024)throw Error(T('文件 ','The file is ')+(buf.length/1024).toFixed(0)+T('KB 超过控制器 48KB 上限,请在 Studio 里缩短或降帧率','KB, over the controller limit of 48KB. Shorten it or lower the frame rate in Studio'));
    let used=[];try{used=(await get('/wfx/list')).map(x=>x.slot);}catch(e){}
    let slot=-1;for(let k=0;k<=15;k++)if(!used.includes(k)){slot=k;break;}
    const nm=prompt(T('效果名称(将存到控制器槽位 ','Effect name (will be stored in controller slot ')+(slot<0?'?':slot)+')',f.name.replace(/\.wseq$/i,''));if(nm==null)return;
    if(slot<0){const s2=prompt(T('16 个槽位已满,输入要覆盖的槽位 0-15','All 16 slots are full. Enter the slot to overwrite (0-15)'),'0');slot=parseInt(s2,10);if(!(slot>=0&&slot<=15))return;}
    await uploadFile(slot+'.wseq',new Blob([buf]));await fetch('/wfx/name?slot='+slot+'&name='+encodeURIComponent(nm),{method:'POST'});
    toast(T('效果已存到控制器槽位 ','Effect stored in controller slot ')+slot+T(',点即播放','. Tap it to play'));onDone&&onDone();}
  catch(e){toast(T('导入效果失败:','Effect import failed: ')+e.message);}}
