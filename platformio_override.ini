; WELLVOW STRIP 本地编译配置(被 .gitignore 忽略,只在本机生效)。
; 以 wellvow-ui-platform/firmware/esp32_wled_usermod/platformio_override.ini 为底,针对当前 usermod 调整:
;  - 不再关闭 NimBLE OBSERVER 角色:usermod 用 NimBLEScan 收遥控器广播,关了编译不过
;  - 打开 auto_save usermod:开机恢复上次状态(bootPreset=250)依赖它
;  - 基线必须是 esp32dev_V4(arduino-esp32 2.0.9 / IDF4.4):esp32dev 用的 Aircoookie 1.0.6.4 库没有 BT/WiFi 共存模块,
;    NimBLEDevice::init -> esp_bt_controller_enable -> coex_init 直接 abort(),固件无限重启
[platformio]
default_envs = wellvow_esp32

; ── WELLVOW: WLED 0.15.0-b6 的 platformio.ini 里没有 env:esp32dev_V4(上游在 b7 之后才加),
;    经典 ESP32(W3 MINI-1)必须用 arduino-esp32 2.0.9 / IDF4.4 这条线,否则 NimBLE 起来就 coex_init abort()。
;    这里照 b6 已有的 [esp32_idf_V4] 组补一份同名环境,下面几个 wellvow_* 环境继续 extends 它。
[env:esp32dev_V4]
board = esp32dev
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=ESP32_V4
  ${esp32.AR_build_flags}
lib_deps = ${esp32_idf_V4.lib_deps}
  ${esp32.AR_lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = ${esp32.default_partitions}

[env:wellvow_esp32]
extends = env:esp32dev_V4
build_flags = ${env:esp32dev_V4.build_flags}
  -D SR_DMTYPE=5 -D I2S_SDPIN=35 -D I2S_WSPIN=27 -D I2S_CKPIN=-1 -D I2S_USE_16BIT_SAMPLES -D SR_PDM_SCALE=2.0f   ;; ES7201 PDM 麦克风出厂默认脚(网页 Usermods 里仍可改)
  -D DATA_PINS=15                        ;; 出厂默认 OUT1=GPIO15(WLED 0.15 只认 DATA_PINS)
  -D USERMOD_WELLVOW_BLE
  -D USERMOD_AUTO_SAVE
  -D USERMOD_AUTO_SAVE_ON_BOOT=true
  -D AUTOSAVE_AFTER_SEC=5                 ;; 断电记忆:改动后 5 秒就存成开机状态(10-23 用户要求;原 30 秒内断电会丢)
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=9   ;; 2026-10-23 用户定:最多 9 部手机同时连(固件按连接各自鉴权)
  -D WLED_RELEASE_NAME=WLED-STRIP-W705 -D WELLVOW_STRIP_W705   ;; 10-23 用户定的固件名 / 型号 WLED_STRIP_W705(只匹配 H705/H805)
  -D MAX_NUM_SEGMENTS=8                ;; 10-23 用户定:STRIP 最多 8 段(每段 82B + JSON 体积)
  -D WLED_MAX_BUSSES=2 -D WLED_MAX_DIGITAL_CHANNELS=2 -D WLED_MAX_ANALOG_CHANNELS=0   ;; 本产品只有 OUT1/OUT2 两个输出口,总线固定 2 路(10-23 用户定;也满足“段数 ≥ 总线数”的编译检查)
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144   ;; 兜底:指令已改为主循环执行,再给 nimble_host 多留点栈
  ;; 2026-10-15 N4(经典 ESP32,无 PSRAM)省内存:与 wellvow_full 对齐。实测开网页 /wled 时堆跌到 13KB 触发 bad_alloc 重启
  -D JSON_BUFFER_SIZE=8192           ;; 10-23:段数上限 8 后 /json/state 最多约 3.5KB,8KB 够,省 8KB 给 9 路蓝牙
  -D WLED_DISABLE_WEBSOCKETS         ;; 网页改轮询,省每个连接的 WS 缓冲
  -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=12   ;; 9 连接的 mbuf 池
  -D CONFIG_BT_NIMBLE_MAX_BONDS=1
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=20   ;; 每条连接订阅通知各占一个 CCCD,9 连接要 ≥9
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_LOXONE
  ; 给 BLE 腾内存:本产品用不到的模块(加 HTTP 接口后开机堆余量掉到 45KB,BT 控制器起不来)
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_2D
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_PXMAGIC
build_unflags = ${common.build_unflags} -D WLED_ENABLE_DMX_INPUT
lib_deps = ${env:esp32dev_V4.lib_deps}
  h2zero/NimBLE-Arduino @ ^1.4.1
; 必须用这张表:设备出厂就是 64KB FS @0x3F0000,换成 256KB_FS 会让 WLED 在新位置格式化、丢掉全部配置/预设
board_build.partitions = usermods/pixels_dice_tray/WLED_ESP32_4MB_64KB_FS.csv
monitor_speed = 115200
board_build.filesystem = littlefs

; 全功能版:不裁 WLED 任何模块(Alexa/Hue/IR/Loxone/MQTT/ESP-NOW/2D/Adalight/PixelMagic/DMX 输入都在),
; 只保留 BLE 相关裁剪。能否用取决于开机堆余量是否够 BT 控制器启动 —— 见串口 [WLV-BLE] start attempt: heap free=
; WLED-STRIP-H706(10-24 用户定):同 N4 硬件,只适配 H706 / Pro 系列(SM16825),接口正负极与 H705 相反
[env:wellvow_esp32_h706]
extends = env:wellvow_esp32
build_flags = ${env:wellvow_esp32.build_flags}
  -D WLED_RELEASE_NAME=WLED-STRIP-H706 -D WELLVOW_STRIP_H706
build_unflags = ${env:wellvow_esp32.build_unflags} -D WLED_RELEASE_NAME=WLED-STRIP-W705 -D WELLVOW_STRIP_W705

[env:wellvow_full]
extends = env:esp32dev_V4
build_flags = ${env:esp32dev_V4.build_flags}
  -D USERMOD_WELLVOW_BLE
  -D USERMOD_AUTO_SAVE
  -D USERMOD_AUTO_SAVE_ON_BOOT=true
  -D AUTOSAVE_AFTER_SEC=5                 ;; 断电记忆:改动后 5 秒就存成开机状态(10-23 用户要求;原 30 秒内断电会丢)
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=9   ;; 2026-10-23 用户定:最多 9 部手机同时连(固件按连接各自鉴权)
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144   ;; 兜底:指令已改为主循环执行,再给 nimble_host 多留点栈
  ; ---- 内存优化(2026-09-07 实测 MQTT+Alexa+Hue+BLE 同开会崩,以下每项都是省 RAM)----
  -D JSON_BUFFER_SIZE=16384          ; WLED JSON 静态缓冲 32KB -> 16KB(const.h 已加 #ifndef)
  -D WLED_DISABLE_WEBSOCKETS         ; 网页改轮询,省每个连接的 WS 缓冲
  -D CONFIG_BT_NIMBLE_MAX_BONDS=1
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=20   ;; 每条连接订阅通知各占一个 CCCD,9 连接要 ≥9
  -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=12   ;; 9 连接的 mbuf 池
build_unflags = ${common.build_unflags}
lib_deps = ${env:esp32dev_V4.lib_deps}
  h2zero/NimBLE-Arduino @ ^1.4.1
board_build.partitions = usermods/pixels_dice_tray/WLED_ESP32_4MB_64KB_FS.csv
monitor_speed = 115200
board_build.filesystem = littlefs

; 注意:新 env 会让 PlatformIO 重新 git clone lib_deps(本机连不上 GitHub 会失败)。离线时用:
[env:wellvow_s3_n8r2]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi     ;; N8R2 = 四线 flash + 四线 PSRAM(R8 八线才是 qio_opi)
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
upload_speed = 921600
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=WELLVOW_S3_N8R2
  -D SR_DMTYPE=5 -D I2S_SDPIN=35 -D I2S_WSPIN=5 -D I2S_CKPIN=-1 -D I2S_USE_16BIT_SAMPLES -D SR_PDM_SCALE=2.0f    ;; ES7201 PDM 麦克风:DATA GPIO35 / CLOCK GPIO5
  -D CONFIG_LITTLEFS_FOR_IDF_3_2 -D WLED_WATCHDOG_TIMEOUT=0 -D WLED_ENABLE_JSONLIVE
  -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1   ;; W3-S3 正式板不再用 CP2102N,Micro-USB 直接接 GPIO19/20 走原生 USB-Serial-JTAG(日志/下载都走它)
  -DBOARD_HAS_PSRAM
  -D USERMOD_WELLVOW_BLE
  -D WELLVOW_BOARD_S3
  -D USERMOD_AUTO_SAVE
  -D USERMOD_AUTO_SAVE_ON_BOOT=true
  -D AUTOSAVE_AFTER_SEC=5                 ;; 断电记忆:改动后 5 秒就存成开机状态(10-23 用户要求;原 30 秒内断电会丢)
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=9   ;; 2026-10-23 用户定:最多 9 部手机同时连(固件按连接各自鉴权)
  -D MAX_NUM_SEGMENTS=16               ;; 10-23 用户定:S3 版 16 段(N4 版 8 段)
  -D WLED_MAX_BUSSES=2 -D WLED_MAX_DIGITAL_CHANNELS=2 -D WLED_MAX_ANALOG_CHANNELS=0   ;; 两个输出口,总线固定 2 路
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=20
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144   ;; 兜底:指令已改为主循环执行,再给 nimble_host 多留点栈
  -D LEDPIN=15 -D DATA_PINS=15,2 -D PIXEL_COUNTS=30,30 -D BTNPIN=4
  ;; 出厂默认两路输出:OUT1=GPIO15 / OUT2=GPIO2。WLED 只按 DATA_PINS 建默认总线,
  ;; 只写一个脚的话第二个口根本不会建总线 —— 表现就是"只有一个输出口能亮"。按键 GPIO4
  -D ABL_MILLIAMPS_DEFAULT=0             ;; 灯带外部供电,不走控制器 —— 关掉 WLED 自动限流,否则灯多时亮度被压死、滑块看不出变化
  -D WELLVOW_S3_QUAD_PSRAM               ;; N8R2 是四线 PSRAM,GPIO33-37 没被占用;不加这个 WLED 会拒绝麦克风的 GPIO35,音乐模式永远没反应
  ${esp32.AR_build_flags}                ;; S3 内存够,音乐律动(ES7201:CLOCK GPIO5 / DATA GPIO35)用 WLED 自带 audioreactive
lib_deps = ${esp32s3.lib_deps}
  ${esp32.AR_lib_deps}
  h2zero/NimBLE-Arduino @ ^1.4.1
board_build.partitions = tools/WLED_ESP32_8MB.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

;; ── 以下三个是调试/对比用环境,都基于 wellvow_s3_n8r2,只加编译开关 ──

;; PDM 取另一侧通道:S3 + IDF4.4 左右声道有已知错位,麦克风接在 ES7201 左声道时用它对比
[env:wellvow_s3_n8r2_micR]
extends = env:wellvow_s3_n8r2
build_flags = ${env:wellvow_s3_n8r2.build_flags} -D I2S_USE_RIGHT_CHANNEL

[env:wellvow_s3_n8r2_dbgL]
extends = env:wellvow_s3_n8r2
build_flags = ${env:wellvow_s3_n8r2.build_flags} -D WELLVOW_SERIAL_CMDS

;; 调试版(右通道)
[env:wellvow_s3_n8r2_dbgR]
extends = env:wellvow_s3_n8r2
build_flags = ${env:wellvow_s3_n8r2.build_flags} -D WELLVOW_SERIAL_CMDS -D I2S_USE_RIGHT_CHANNEL
